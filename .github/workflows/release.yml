name: release

on:
  push:
    tags: ['v*']
  # Release from the Actions tab (or the API) without pushing a tag: the release step creates the tag on the
  # checked-out commit. The tag must match the app's version.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release, e.g. v0.10.0-rc.2 (must match versionName)'
        required: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 tools/verify_release.py --tag "$TAG"
          echo "RELEASE_NOTES=docs/RELEASE_${TAG#v}.md" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Test release candidate
        run: |
          uv run --with pytest -- python -m pytest forge/tests -q
          uv run --with pytest --with jsonschema -- python -m pytest forge/schema_tests -q
          uv run -- python -m unittest discover -s android/probe/tests -v
          gradle -p android :app:testDebugUnitTest :module:testDebugUnitTest :probe:testStandardDebugUnitTest :probe:testDiagnosticsDebugUnitTest :probe:assembleStandardDebug :probe:assembleDiagnosticsDebug --no-daemon
      - name: Decode Android release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/cloak.keystore"
      - name: Build release APK
        env:
          CLOAK_KEYSTORE_PATH: ${{ runner.temp }}/cloak.keystore
          CLOAK_KEYSTORE_PASSWORD: ${{ secrets.CLOAK_KEYSTORE_PASSWORD }}
        run: gradle -p android :app:assembleRelease :module:packageModule --no-daemon
      - name: Verify APK and module artifacts
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 tools/verify_release.py --tag "$TAG" --artifacts
      - name: Attach APK and module ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: ${{ env.RELEASE_NOTES }}
          fail_on_unmatched_files: true
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/module/build/module/*.zip
            docs/runtime-evidence/2026-10-17-capture-lifecycle-rerun-031422/evidence-bundle.zip
            docs/runtime-evidence/2026-10-17-capture-lifecycle-rerun-031422/summary.md
            docs/runtime-evidence/2026-10-17-capture-lifecycle-rerun-031422/build-provenance.json
