plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "dev.cyclone.cloak"
    compileSdk 36

    // JVM tests exercise JSONObject-driven logic against the stub android.jar,
    // so unmocked framework methods must return defaults instead of throwing.
    testOptions {
        unitTests.returnDefaultValues = true
        // Robolectric screen tests render the real Compose UI with the app's resources and assets.
        unitTests.includeAndroidResources = true
        // Robolectric runs offline against the framework jar Gradle fetched (see robolectricRuntime below).
        unitTests.all {
            dependsOn("copyRobolectricRuntime")
            systemProperty "robolectric.offline", "true"
            systemProperty "robolectric.dependency.dir", layout.buildDirectory.dir("robolectric").get().asFile.absolutePath
        }
    }

    defaultConfig {
        applicationId "dev.cyclone.cloak"
        minSdk 29
        targetSdk 36
        versionCode 21
        versionName "0.10.0-alpha.1"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("CLOAK_KEYSTORE_PATH")
            def ksPass = System.getenv("CLOAK_KEYSTORE_PASSWORD")
            if (ksPath != null && ksPass != null) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias "cloak"
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("CLOAK_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        aidl true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

// The built-in phone catalog is shared with the Python forge (catalog/phones.json at the repository root).
android.sourceSets.main.assets.srcDir("../../catalog")
// JVM tests read the same catalog and the cross-language test vectors.
android.sourceSets.test.resources.srcDirs += ["../../catalog", "../../forge/tests/vectors"]

// Embed the module built from this exact source/version in the app so Root Doctor can repair
// missing or outdated installs even when the phone has no network connection.
def cloakModuleZipName = "cyclone-cloak-${android.defaultConfig.versionName}.zip"
def generatedCloakAssets = layout.buildDirectory.dir("generated/rootDoctorAssets")
android.sourceSets.main.assets.srcDir(generatedCloakAssets)
def cloakModuleZip = layout.projectDirectory.file("../module/build/module/${cloakModuleZipName}")
def embedCloakModule = tasks.register("embedCloakModule") {
    dependsOn(":module:packageModule")
    inputs.file(cloakModuleZip)
    outputs.file(generatedCloakAssets.map { it.file("cyclone-cloak-module.zip") })
    doLast {
        if (!cloakModuleZip.asFile.isFile()) {
            throw new GradleException("The matching module ZIP was not built: ${cloakModuleZip.asFile}")
        }
        copy {
            from cloakModuleZip.asFile
            into generatedCloakAssets.get().asFile
            rename { "cyclone-cloak-module.zip" }
        }
    }
}
tasks.named("preBuild").configure { dependsOn(embedCloakModule) }

dependencies {
    testImplementation "junit:junit:4.13.2"
    // Real org.json on the JVM: the stub android.jar throws "not mocked" for
    // JSONObject, while return-defaults breaks chained put() calls.
    testImplementation "org.json:json:20240303"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    implementation "androidx.activity:activity-compose:1.9.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.6"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.foundation:foundation"
    implementation platform("androidx.compose:compose-bom:2024.09.00")
    testImplementation platform("androidx.compose:compose-bom:2024.09.00")
    debugImplementation platform("androidx.compose:compose-bom:2024.09.00")
}

// Robolectric's Android framework, fetched by Gradle (cached, proxy-aware) instead of Robolectric's own downloader.
configurations { robolectricRuntime }
dependencies {
    robolectricRuntime "org.robolectric:android-all-instrumented:14-robolectric-10818077-i7"
    // Robolectric loads app resources with its newest framework.
    robolectricRuntime "org.robolectric:android-all-instrumented:15-robolectric-12650502-i7"
}
tasks.register("copyRobolectricRuntime", Copy) {
    from configurations.robolectricRuntime
    into layout.buildDirectory.dir("robolectric")
}
