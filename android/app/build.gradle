plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "dev.cyclone.cloak"
    compileSdk 36

    defaultConfig {
        applicationId "dev.cyclone.cloak"
        minSdk 29
        targetSdk 36
        versionCode 10
        versionName "0.5.0-alpha.3"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("CLOAK_KEYSTORE_PATH")
            def ksPass = System.getenv("CLOAK_KEYSTORE_PASSWORD")
            if (ksPath != null && ksPass != null) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias "cloak"
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("CLOAK_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        aidl true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    implementation "androidx.activity:activity-compose:1.9.2"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.foundation:foundation"
    implementation platform("androidx.compose:compose-bom:2024.09.00")
}
