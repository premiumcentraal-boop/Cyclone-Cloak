name: release

on:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Decode Android release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/cloak.keystore"
      - name: Build release APK
        env:
          CLOAK_KEYSTORE_PATH: ${{ runner.temp }}/cloak.keystore
          CLOAK_KEYSTORE_PASSWORD: ${{ secrets.CLOAK_KEYSTORE_PASSWORD }}
        run: gradle -p android :app:assembleRelease :module:packageModule --no-daemon
      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: docs/RELEASE_0.7.0-alpha.1.md
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/module/build/module/*.zip
