name: release

on:
  push:
    tags: ['v*']
  # Release from the Actions tab (or the API) without pushing a tag: the release step creates the tag on the
  # checked-out commit. The tag must match the app's version.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release, e.g. v0.10.0-alpha.1 (must match versionName)'
        required: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^ *versionName "\(.*\)"/\1/p' android/app/build.gradle)
          module=$(sed -n 's/^version=//p' android/module/module.prop)
          echo "tag=$TAG app=v$version module=$module"
          [ "$TAG" = "v$version" ] && [ "$TAG" = "$module" ] || { echo "::error::tag $TAG does not match app v$version / module $module"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Decode Android release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/cloak.keystore"
      - name: Build release APK
        env:
          CLOAK_KEYSTORE_PATH: ${{ runner.temp }}/cloak.keystore
          CLOAK_KEYSTORE_PASSWORD: ${{ secrets.CLOAK_KEYSTORE_PASSWORD }}
        run: gradle -p android :app:assembleRelease :module:packageModule --no-daemon
      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: docs/RELEASE_0.10.0-alpha.1.md
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/module/build/module/*.zip
