name: release

on:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          CLOAK_KEYSTORE_PASSWORD: ${{ secrets.CLOAK_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_B64" || -z "$CLOAK_KEYSTORE_PASSWORD" ]]; then
            echo "Release signing secrets are required to publish an APK." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cloak.keystore"
          test -s "$RUNNER_TEMP/cloak.keystore"
      - name: Build release APK
        env:
          CLOAK_KEYSTORE_PATH: ${{ runner.temp }}/cloak.keystore
          CLOAK_KEYSTORE_PASSWORD: ${{ secrets.CLOAK_KEYSTORE_PASSWORD }}
        run: gradle -p android :app:assembleRelease --no-daemon
      - name: Verify release APK signature
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          signature_details="$("$apksigner_path" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$signature_details"
          expected_certificate="17ca3617b0cbaf250d2ef03e945b319e57695de6d977c652ded243ad5656f553"
          if ! grep -Fqx "Signer #1 certificate SHA-256 digest: $expected_certificate" <<<"$signature_details"; then
            echo "APK was not signed with the Alpha 4 release certificate." >&2
            exit 1
          fi
      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: android/app/build/outputs/apk/release/*.apk
