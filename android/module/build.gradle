plugins {
    id "com.android.library"
}

def abis = ["arm64-v8a", "armeabi-v7a"]
def moduleProperties = new Properties()
file("module.prop").withInputStream { moduleProperties.load(it) }
def moduleVersion = moduleProperties.getProperty("version").replaceFirst(/^v/, "")

android {
    namespace "dev.cyclone.cloak.module"
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        minSdk 26
        externalNativeBuild {
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

// Packages the Zygisk module the way Magisk expects:
//   module.prop
//   zygisk/<abi>.so
tasks.register("packageModule") {
    group = "cyclone"
    description = "Assembles the Cyclone Cloak Magisk module zip."
    dependsOn "assembleRelease"
    doLast {
        def outDir = layout.buildDirectory.dir("module").get().asFile
        outDir.deleteDir()
        outDir.mkdirs()
        def stage = new File(outDir, "stage")
        stage.mkdirs()
        copy {
            from("module.prop")
            into stage
        }
        abis.each { abi ->
            fileTree("build/intermediates/cxx").matching {
                include "**/RelWithDebInfo/*/obj/${abi}/libcloak.so"
            }.each { file ->
                copy {
                    from file
                    into new File(stage, "zygisk")
                    rename { "${abi}.so" }
                }
            }
        }
        def zipName = "cyclone-cloak-${moduleVersion}.zip"
        ant.zip(destfile: new File(outDir, zipName), basedir: stage)
        println "module zip: ${outDir}/${zipName}"
    }
}

// Hook bridge pipeline: extract Pine from its AAR, compile the bridge, dex it
// with d8, and stage the assets that CMake embeds into libcloak.so (see
// src/main/cpp/CMakeLists.txt). Everything is embedded: the scoped app never
// needs to read anything from /data/adb.
configurations {
    hookEmbed
    hookD8
}

dependencies {
    hookEmbed "top.canyie.pine:core:0.3.0"
    hookD8 "com.android.tools:r8:8.13.25"
}

def hookWork = layout.buildDirectory.dir("hook")
def embeddedDir = file("src/main/cpp/embedded")

tasks.register("prepareHookPine") {
    dependsOn configurations.hookEmbed
    doLast {
        def aar = configurations.hookEmbed.files.find { it.name.endsWith(".aar") }
        if (aar == null) throw new GradleException("Pine core AAR not found in hookEmbed")
        def out = hookWork.get().asFile
        out.mkdirs()
        copy {
            from zipTree(aar)
            into out
        }
    }
}

tasks.register("compileHookBridge", JavaCompile) {
    dependsOn "prepareHookPine"
    source "src/hook/java"
    classpath = files(hookWork.map { it.dir("classes.jar") })
    destinationDirectory = hookWork.map { it.dir("classes") }
    options.release.set(11)
}

tasks.register("jarHookBridge", Jar) {
    dependsOn "compileHookBridge"
    archiveFileName = "hook-bridge.jar"
    destinationDirectory = hookWork
    from hookWork.map { it.dir("classes") }
}

tasks.register("dexHookBridge", JavaExec) {
    dependsOn "jarHookBridge"
    classpath = files(configurations.hookD8)
    mainClass.set("com.android.tools.r8.D8")
    doFirst {
        def out = hookWork.get().asFile
        args("--release", "--min-api", "26", "--output", out.absolutePath,
                new File(out, "hook-bridge.jar").absolutePath,
                new File(out, "classes.jar").absolutePath)
    }
}

tasks.register("embedHookAssets") {
    dependsOn "dexHookBridge"
    doLast {
        def work = hookWork.get().asFile
        embeddedDir.mkdirs()
        copy {
            from new File(work, "classes.dex")
            into embeddedDir
            rename { "hooks.dex" }
        }
        abis.each { abi ->
            def out = new File(embeddedDir, abi)
            out.mkdirs()
            copy { from new File(work, "jni/${abi}/libpine.so"); into out }
            def gen = new File(out, "embedded_assets.cpp")
            gen.text = emitEmbeddedAssets(
                new File(work, "classes.dex").bytes,
                new File(out, "libpine.so").bytes)
        }
    }
}

def emitEmbeddedAssets(byte[] dex, byte[] pine) {
    def sb = new StringBuilder()
    sb.append("// Generated by the Gradle embedHookAssets task; do not edit.\n")
    sb.append("#include <cstddef>\n\n")
    emitByteArray(sb, "CLOAK_HOOKS_DEX", dex)
    emitByteArray(sb, "CLOAK_PINE_LIB", pine)
    return sb.toString()
}

def emitByteArray(StringBuilder sb, String name, byte[] data) {
    sb.append("extern const unsigned char ${name}[] = {\n")
    for (int start = 0; start < data.length; start += 24) {
        def end = Math.min(start + 24, data.length)
        def row = (start..<end).collect { i -> String.valueOf(data[i] & 0xFF) }.join(",")
        sb.append("    ${row},\n")
    }
    sb.append("};\n")
    sb.append("extern const size_t ${name}_SIZE = sizeof(${name});\n\n")
}

tasks.matching { it.name.startsWith("configureCMake") || it.name.startsWith("buildCMake") }.configureEach {
    dependsOn "embedHookAssets"
}
