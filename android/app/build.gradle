plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "dev.cyclone.cloak"
    compileSdk 36

    defaultConfig {
        applicationId "dev.cyclone.cloak"
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
}
